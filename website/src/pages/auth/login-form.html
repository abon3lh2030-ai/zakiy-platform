  <!-- تسجيل الدخول: الشاشة الافتراضية عند الدخول، مع إمكانية التبديل لإنشاء حساب أو المتابعة بدون حساب -->
  <section class="card auth-card" id="login-form">
    <span class="auth-logo">ذكيّ</span>
    <h2 data-i18n="login_title">تسجيل الدخول</h2>
    <p class="desc" data-i18n="login_desc">أدخل بياناتك للمتابعة، أو سوّي حساب يحفظ تقدمك</p>
    <div class="auth-fields">
      <input type="text" id="loginEmail" class="text-input" placeholder="الإيميل أو اسم المستخدم" data-i18n-ph="ph_email_or_username">
      <input type="password" id="loginPassword" class="text-input" placeholder="كلمة المرور" data-i18n-ph="ph_password">
    </div>
    <div class="auth-actions-stack">
      <button class="primary" id="loginSubmitBtn" data-i18n="btn_enter">دخول</button>
    </div>
    <div id="loginError"></div>
    <div class="auth-switch">
      <button class="link-btn" id="goToSignupBtn" data-i18n="link_go_signup">🆕 ما عندك حساب؟ أنشئ واحد</button>
      <button class="link-btn" id="guestFromLoginBtn" data-i18n="link_continue_guest">➡️ استمر بدون حساب</button>
    </div>
  </section>
