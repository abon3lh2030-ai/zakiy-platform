  <!-- صفحة اختبار وحد (معلم: تعديل/نشر قبل النشر، تصحيح بعد النشر) -->
  <section class="card hidden" id="step-quiz-detail">
    <span class="step-label" id="quizDetailSubjectLabel"></span>
    <h2 id="quizDetailTitle"></h2>
    <p class="desc" id="quizDetailMeta"></p>
    <p class="desc hidden" id="quizDetailSchedule"></p>

    <!-- اختبار منصة مدرستي - رابط الاختبار يقدر المعلم يضيفه/يعدّله بأي وقت -->
    <div id="quizMadrasatiLinkWrap" class="hidden">
      <h3 class="sub-heading" data-i18n="label_external_link">رابط الاختبار بمنصة مدرستي (اختياري)</h3>
      <input type="url" id="quizMadrasatiLinkInput" class="text-input" placeholder="https://..." data-i18n-ph="ph_external_link">
      <div class="actions" style="margin-top:10px;">
        <button class="ghost" id="quizMadrasatiSaveLinkBtn" data-i18n="btn_save">حفظ</button>
        <a class="ghost" href="https://schools.madrasati.sa/Auth/SignIn" target="_blank" rel="noopener" data-i18n="link_create_on_madrasati">🔗 ما سويته بعد؟ افتح مدرستي وسوّيه من هناك</a>
      </div>
      <div id="quizMadrasatiLinkError"></div>
    </div>

    <!-- قبل النشر -->
    <div id="quizUnpublishedActions" class="hidden">
      <p class="desc" data-i18n="quiz_unpublished_hint">الاختبار لسا ما نُشر - الطلاب ما يشوفونه إلا بعد النشر.</p>
      <div class="actions">
        <button class="primary" id="quizPublishBtn" data-i18n="btn_publish_quiz">📢 نشر الاختبار</button>
        <button class="ghost" id="quizEditBtn" data-i18n="btn_edit_quiz">✏️ تعديل</button>
      </div>
    </div>

    <!-- زر الحذف يظهر دايمًا (قبل النشر وبعده - المعلم يقدر يحذف اختبار
         منشور برضو، الباك إند ما يقيّده) -->
    <div class="actions" style="margin-top:10px;">
      <button class="ghost" id="quizDeleteBtn" data-i18n="btn_delete_quiz">🗑️ حذف الاختبار</button>
    </div>

    <!-- بعد النشر -->
    <div id="quizPublishedView" class="hidden">
      <h3 class="sub-heading" data-i18n="quiz_students_heading">👥 حالة التسليم والتصحيح</h3>
      <div id="quizStudentsList"></div>
    </div>
    <div id="quizDetailError"></div>
  </section>
