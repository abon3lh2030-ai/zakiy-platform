  <!-- شات مع الذكاء الاصطناعي حول الملف (وضع فردي بس) -->
  <section class="card hidden" id="step-chat">
    <span class="step-label" data-i18n="chat_step_label">💬 اسأل الذكاء الاصطناعي</span>
    <h2 data-i18n="chat_heading">عندك سؤال عن الملف؟</h2>
    <p class="desc" data-i18n="chat_desc">اسأل أي سؤال عن محتوى الملف اللي رفعته وبيجاوبك ذكيّ</p>
    <div class="chat-messages" id="aiChatMessages"></div>
    <div class="actions">
      <input type="text" id="aiChatInput" class="text-input" placeholder="اكتب سؤالك..." data-i18n-ph="ph_ask_question">
      <button class="primary" id="aiChatSendBtn" data-i18n="btn_send">إرسال</button>
    </div>
    <div id="aiChatError"></div>
  </section>
