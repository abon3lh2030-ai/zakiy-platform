  <!-- المساعد الذكي - محادثة وحدة (كل محادثة بصفحتها الخاصة) -->
  <section class="card hidden" id="step-ai-conversation">
    <div class="ai-chat-page">
      <div class="ai-chat-header">
        <button class="ai-chat-back-btn" id="aiChatBackBtn" title="الرجوع لقائمة المحادثات">⋮</button>
        <span class="ai-chat-title" id="aiChatTitle" data-i18n="ai_new_chat_title">محادثة جديدة</span>
      </div>

      <div id="aiChatError2"></div>

        <input type="text" id="aiConversationInput" class="text-input" placeholder="اكتب رسالتك..." data-i18n-ph="ph_ai_message">
        <button class="primary" id="aiConversationSendBtn" data-i18n="btn_send">إرسال</button>
      </div>
    </div>
