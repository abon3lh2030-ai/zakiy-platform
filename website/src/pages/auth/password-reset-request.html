  <!-- طلب استعادة كلمة المرور — يظهر بعد فشل تسجيل الدخول فقط -->
  <section class="card hidden auth-card" id="step-password-reset-request">
    <span class="auth-logo">ذكيّ</span>
    <h2 data-i18n="password_reset_request_heading">استعادة كلمة المرور</h2>
    <p class="desc" data-i18n="password_reset_request_desc">اكتب بريد حسابك الشخصي وسنرسل لك رابطًا آمنًا لتعيين كلمة مرور جديدة.</p>
    <div class="auth-fields"><input type="email" id="passwordResetEmail" class="text-input" autocomplete="email" placeholder="البريد الإلكتروني" data-i18n-ph="ph_email"></div>
    <div class="auth-actions-stack"><button class="primary" id="passwordResetSendBtn" data-i18n="btn_send_reset_link">إرسال رابط الاستعادة</button></div>
    <div id="passwordResetRequestMsg"></div>
    <div class="auth-switch"><button class="link-btn" id="passwordResetBackBtn" data-i18n="link_back_to_login">الرجوع لتسجيل الدخول</button></div>
  </section>
