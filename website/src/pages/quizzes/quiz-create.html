  <!-- إنشاء/تعديل اختبار (معلم بس) -->
  <section class="card hidden" id="step-quiz-create">
    <span class="step-label" data-i18n="quiz_create_step_label">📝 اختبار جديد</span>
    <h2 id="quizCreateHeading" data-i18n="quiz_create_heading">إنشاء اختبار</h2>

    <select id="quizClassSelect" class="text-input"></select>
    <input type="text" id="quizSubjectInput" class="text-input" placeholder="اسم المادة" data-i18n-ph="ph_quiz_subject" style="margin-top:10px;">
    <input type="text" id="quizTitleInput" class="text-input" placeholder="عنوان الاختبار" data-i18n-ph="ph_quiz_title" style="margin-top:10px;">

    <!-- منصة الاختبار: ذكي (الوضع الحالي) أو مدرستي (رابط خارجي بس) -->
    <div class="actions" style="margin-top:14px;">
      <label class="desc" style="display:flex; align-items:center; gap:6px;">
        <input type="radio" name="quizPlatform" value="zakiy" id="quizPlatformZakiy" checked>
        <span data-i18n="platform_zakiy_quiz">💡 اختبار منصة ذكي</span>
      </label>
      <label class="desc" style="display:flex; align-items:center; gap:6px;">
        <input type="radio" name="quizPlatform" value="madrasati" id="quizPlatformMadrasati">
        <span data-i18n="platform_madrasati_quiz">🎓 اختبار منصة مدرستي</span>
      </label>
    </div>

    <div id="quizZakiyOptionsWrap">
      <input type="number" id="quizTimeInput" class="text-input" placeholder="الوقت بالدقايق" data-i18n-ph="ph_quiz_time" min="1" style="margin-top:10px;">

      <h3 class="sub-heading" style="margin-top:24px;" data-i18n="quiz_questions_heading">📋 الأسئلة</h3>
      <div id="quizQuestionsList"></div>
      <div class="actions" style="margin-top:8px;">
        <button class="ghost" id="quizAddQuestionBtn" data-i18n="btn_add_question">➕ إضافة سؤال</button>
      </div>
    </div>

    <!-- خيارات اختبار منصة مدرستي - رابط الاختبار اللي سواه هناك (اختياري) +
         رابط سريع لمدرستي لو لسا ما سواه -->
    <div id="quizMadrasatiOptionsWrap" class="hidden">
      <label class="desc" style="display:flex; flex-direction:column; gap:4px; margin-top:14px;">
        <span data-i18n="label_external_link">رابط الاختبار بمنصة مدرستي (اختياري)</span>
        <input type="url" id="quizExternalLinkInput" class="text-input" placeholder="https://..." data-i18n-ph="ph_external_link">
      </label>
      <p class="desc" style="margin-top:6px;">
        <a id="quizMadrasatiCreateLink" href="https://schools.madrasati.sa/Auth/SignIn" target="_blank" rel="noopener" data-i18n="link_create_on_madrasati">🔗 ما سويته بعد؟ افتح مدرستي وسوّيه من هناك</a>
      </p>
    </div>

    <div class="actions" style="flex-wrap:wrap; margin-top:10px;">
      <label class="desc" style="display:flex; flex-direction:column; gap:4px;">
        <span data-i18n="label_open_at">يبدأ (اختياري)</span>
        <input type="datetime-local" id="quizOpenAtInput" class="text-input">
      </label>
      <label class="desc" style="display:flex; flex-direction:column; gap:4px;">
        <span data-i18n="label_close_at">يقفل (اختياري)</span>
        <input type="datetime-local" id="quizCloseAtInput" class="text-input">
      </label>
    </div>

    <div class="actions" style="margin-top:22px;">
      <button class="primary" id="quizSaveBtn" data-i18n="btn_save_quiz">حفظ الاختبار</button>
    </div>
    <div id="quizCreateError"></div>
  </section>
