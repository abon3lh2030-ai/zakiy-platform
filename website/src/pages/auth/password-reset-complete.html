  <!-- يصل لها المستخدم من رابط Supabase في البريد -->
  <section class="card hidden auth-card" id="step-password-reset-complete">
    <span class="auth-logo">ذكيّ</span>
    <h2 data-i18n="password_reset_complete_heading">اختر كلمة مرور جديدة</h2>
    <p class="desc" data-i18n="password_reset_complete_desc">اكتب كلمة المرور الجديدة ثم أكدها.</p>
    <div class="auth-fields">
      <input type="password" id="passwordResetNew" class="text-input" autocomplete="new-password" placeholder="كلمة مرور جديدة" data-i18n-ph="ph_new_password">
      <input type="password" id="passwordResetConfirm" class="text-input" autocomplete="new-password" placeholder="أعد كتابتها" data-i18n-ph="ph_confirm_password">
    </div>
    <div class="auth-actions-stack"><button class="primary" id="passwordResetCompleteBtn" data-i18n="btn_save_new_password">حفظ كلمة المرور الجديدة</button></div>
    <div id="passwordResetCompleteMsg"></div>
  </section>
