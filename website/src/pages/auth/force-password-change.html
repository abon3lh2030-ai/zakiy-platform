  <!-- بوابة إجبار تغيير كلمة السر أول دخول (حسابات مؤسسية بكلمة سر مؤقتة) -
       ما فيها زر رجوع وما تُسجّل بالتاريخ العادي، بوابة صلبة قبل أي شي ثاني -->
  <section class="card hidden auth-card" id="step-force-password-change">
    <span class="auth-logo">ذكيّ</span>
    <h2 data-i18n="force_pw_heading">لازم تغيّر كلمة السر أول</h2>
    <p class="desc" data-i18n="force_pw_desc">حسابك اتسوى بكلمة سر مؤقتة - اختر كلمة سر جديدة تعرفها بس قبل ما تكمل</p>
    <div class="auth-fields">
      <input type="password" id="forcePwNew" class="text-input" placeholder="كلمة مرور جديدة" data-i18n-ph="ph_new_password">
      <input type="password" id="forcePwConfirm" class="text-input" placeholder="أعد كتابتها" data-i18n-ph="ph_confirm_password">
    </div>
    <div class="auth-actions-stack">
      <button class="primary" id="forcePwSubmitBtn" data-i18n="btn_save">حفظ</button>
    </div>
    <div id="forcePwError"></div>
  </section>
